general {
    # Какую команду выполнить ПЕРЕД тем, как система уйдет в сон (systemctl suspend)
    # Заранее блокируем экран, чтобы после просыпания данные не были видны
    before_sleep_cmd = hyprlock  
    
    # Какую команду выполнить ПОСЛЕ просыпания ПК (например, включить экран обратно)
    after_sleep_cmd = swaymsg "output * power on"  # Для Sway
    # after_sleep_cmd = hyprctl dispatch dpms on    # Раскомментируйте, если используете Hyprland
    
    # Игнорировать системные запросы блокировки от приложений (например, браузер при просмотре видео)
    # ignore_dbus_inhibit = false             
}

# --- ШАГ 1: Приглушить яркость экрана (через 2.5 минуты) ---
listener {
    timeout = 150                                
    # Уменьшаем яркость до 10% (требуется утилита brightnessctl)
    on-timeout = brightnessctl set 10%          
    # Возвращаем яркость обратно, как только пользователь двинет мышкой
    on-resume = brightnessctl set 20%          
}

# --- ШАГ 2: Заблокировать экран (через 5 минут) ---
listener {
    timeout = 300                                
    # Вызов вашего настроенного hyprlock
    on-timeout = hyprlock                        
}

# --- ШАГ 3: Выключить монитор (через 5.5 минут) ---
listener {
    timeout = 330                                
    # Выключаем экран (команда для Sway)
    on-timeout = swaymsg "output * power off"   
    # Включаем обратно при активности
    on-resume = swaymsg "output * power on"     
    
    # Единые команды, если вы используете Hyprland вместо Sway:
    # on-timeout = hyprctl dispatch dpms off
    # on-resume = hyprctl dispatch dpms on
}

# --- ШАГ 4: Сон / Суспенд всего ПК (через 10 минут) ---
listener {
    timeout = 600                                
    # Отправка операционной системы в режим ожидания
    on-timeout = systemctl suspend               
}
